<!-- @dsCard height=288 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;800&display=swap">
<style>
  html,body{margin:0;background:var(--paper);height:288px;overflow:hidden}
  .cover{position:relative;width:960px;height:288px;background:radial-gradient(520px 300px at 720px 0,var(--blush),var(--blush-soft) 55%,transparent 100%)}
  svg{position:absolute;inset:0}
  .orange{fill:var(--orange)} .panel{fill:var(--panel)} .brown{fill:var(--panel-brown)} .plum{fill:var(--panel-plum)} .tint{fill:var(--orange-tint)} .white{fill:var(--surface)}
  .lg{rx:30px} .md{rx:22px}
  .name{position:absolute;left:48px;bottom:40px;width:440px;font-family:var(--font-sans);font-size:112px;line-height:.92;color:var(--ink);direction:rtl;text-align:left;margin:0;font-weight:300}
  .name b{font-weight:800}
  .tag{position:absolute;left:48px;bottom:18px;width:440px;font-family:var(--font-sans);font-size:14px;line-height:1.3;color:var(--ink-muted);direction:rtl;text-align:left;margin:0}
</style>
<div class="cover">
  <!--
    blocks: panel sheet 336×192 (radius-sheet-ish via radius-lg 30), orange 120×120 (radius-lg), white card 168×96 (radius-lg), brown 96×64 + plum 96×64 (radius-md), orange-tint 64×64 (radius-md)
    arrangement: the black sheet bleeding off the bottom-right like the route sheet, a white card and the orange block stacked above-left of it like home cards over the glow
    pattern: "soft, friendly, large radii → discs, pills" — the product's active state is the orange pin/dot, so six dot-tipped pills (bars) rise out of the sheet at space-2 gap, two in orange, four in orange-tint
    scales: gap space-2 (8px), pill width 16px (space-4), radius-md 22px on small cards, radius-lg 30px on cards and sheet, pill ends 8px
  -->
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <rect class="panel lg" x="624" y="120" width="336" height="200"/>
    <rect class="brown md" x="648" y="232" width="96" height="64"/>
    <rect class="plum md" x="760" y="232" width="96" height="64"/>
    <rect class="white lg" x="504" y="48" width="168" height="96"/>
    <rect class="orange lg" x="696" y="0" width="120" height="104"/>
    <rect class="tint md" x="520" y="168" width="64" height="64"/>
    <g>
      <rect class="orange" x="872" y="152" width="16" height="64" rx="8"/><circle class="white" cx="880" cy="152" r="5"/>
      <rect class="tint" x="896" y="176" width="16" height="40" rx="8"/><circle class="white" cx="904" cy="176" r="5"/>
      <rect class="orange" x="920" y="136" width="16" height="80" rx="8"/><circle class="white" cx="928" cy="136" r="5"/>
      <rect class="tint" x="848" y="184" width="16" height="32" rx="8"/><circle class="white" cx="856" cy="184" r="5"/>
      <rect class="tint" x="824" y="168" width="16" height="48" rx="8"/><circle class="white" cx="832" cy="168" r="5"/>
      <rect class="tint" x="800" y="190" width="16" height="26" rx="8"/><circle class="white" cx="808" cy="190" r="5"/>
    </g>
    <circle class="orange" cx="588" cy="96" r="22"/><circle class="white" cx="588" cy="96" r="7"/>
  </svg>
  <p class="name">ترب‌<b>گرد</b></p>
  <p class="tag">از چی بخرم تا از کجا بخرم!</p>
</div>
