# Mounted as /etc/nginx/templates/default.conf.template (replacing the stock site); nginx renders it with envsubst (SERVER_NAME, TLS_CERT, TLS_KEY).
# Upstreams go through variables + Docker's resolver so nginx starts even when one is down
# and follows a restarted container's new address.
resolver 127.0.0.11 valid=30s ipv6=off;

proxy_cache_path /var/cache/nginx/img levels=1:2 keys_zone=img:20m max_size=2g inactive=7d use_temp_path=off;

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_proxied any;
gzip_vary on;
gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

server_tokens off;

# Unknown Host headers get nothing.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    server_name ${SERVER_NAME};
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${SERVER_NAME};

    ssl_certificate ${TLS_CERT};
    ssl_certificate_key ${TLS_KEY};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    # ponytail: no Content-Security-Policy yet; Next inlines scripts, so it needs nonces first.

    # The agent and OTP rate limits key on the first X-Forwarded-For hop: overwrite, never append.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    client_max_body_size 1m;

    set $api http://api:8000;
    set $agent http://agent:8001;
    set $web http://web:3000;

    location /api/ { proxy_pass $api; }
    location /admin/ { proxy_pass $api; }
    location /static/ { alias /srv/static/; expires 30d; }

    # SSE: stream every event as it is written.
    location /agent/ {
        proxy_pass $agent;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    # Torob images through us (R-P7): cached 7 days whatever upstream says.
    location /img/ {
        set $torob image.torob.com;
        rewrite ^/img/(.*)$ /$1 break;
        proxy_pass https://$torob;
        proxy_http_version 1.1;  # image.torob.com answers 426 to HTTP/1.0
        proxy_ssl_server_name on;
        proxy_ssl_name image.torob.com;
        proxy_set_header Host image.torob.com;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache img;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1h;
        proxy_cache_use_stale error timeout updating;
        expires 7d;
    }

    location / { proxy_pass $web; }
}
