services:
  db:
    build: ./deploy/db
    environment:
      POSTGRES_USER: torobgard
      POSTGRES_PASSWORD: torobgard
      POSTGRES_DB: torobgard
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torobgard -d torobgard"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://torobgard:torobgard@db:5432/torobgard
      REDIS_URL: redis://redis:6379/0
      DATASET_DIR: /data
      SHARED_DIR: /shared
    ports: ["8000:8000"]
    # exec so SIGTERM from `compose down` reaches runserver, not the shell
    command: sh -c "python manage.py migrate && exec python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    volumes:
      - ./api:/app
      - ./shared:/shared:ro
      - ./docs/starcoach-dataset-v16-cap300-csv:/data:ro
  agent:
    build: ./agent
    env_file: .env
    environment:
      DATABASE_URL: postgresql://torobgard:torobgard@db:5432/torobgard
      REDIS_URL: redis://redis:6379/0
      SHARED_DIR: /shared
      # made by `make agent-testdb` (Django migrate + mini fixtures)
      TEST_DATABASE_URL: postgresql://torobgard:torobgard@db:5432/torobgard_agent_test
    ports: ["${AGENT_PORT:-8001}:8001"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    command: uvicorn torobgard_agent.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./agent:/app
      - ./shared:/shared:ro
      - ./docs/evidence:/evidence:ro  # eval cases (make eval)
volumes:
  pgdata:
